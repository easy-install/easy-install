[package]
name = "easy-install"
version = "1.3.11"
edition = "2024"
license = "MIT"
description = "easy-install"
repository = "https://github.com/easy-install/easy-install"
authors = ["ahaoboy"]
include = ["/src", "/Cargo.toml", "/README.md", "/build.rs"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
async-trait = "0.1"
crud-path = { git = "https://github.com/ahaoboy/crud-path.git", version = "0.1", default-features = false }
easy-archive = { git = "https://github.com/ahaoboy/easy-archive.git", version = "0.2", default-features = false, features = [
  "fmt",
  "decode",
] }
guess-target = { git = "https://github.com/ahaoboy/guess-target.git", version = "0.1", features = [
  "serde",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "time",
  "io-util",
  "net",
  "sync",
], default-features = false }
sssh = { git = "https://github.com/ahaoboy/sssh", version = "0.1", default-features = false, optional = true }
tracing = "0.1"
dirs = "7"
# FIXME: https://github.com/easy-install/easy-install/issues/59
reqwest = { version = "0.12", features = [
  "json",
  "rustls-tls",
  "gzip",
  "cookies",
], default-features = false }

which = "8"
regex = { version = "1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", optional = true }
path-clean = "1"
thiserror = "2"
github-proxy = { version = "0.1", git = "https://github.com/ahaoboy/github-proxy", features = [
  "serde",
  "fetch",
  "token",
  "artifacts",
] }
shellexpand = "3"
fs4 = "1"
humansize = "2"
git-version = { version = "0.3", optional = true }
const-str = { version = "1", optional = true }

[features]
default = ["cli", "archive", "ssh", "logging"]
archive = ["tar", "tar-gz", "tar-xz", "tar-bz", "tar-zstd", "gz", "zip"]
# Remote installation over SSH (`--dir user@host:/path`). Enabled by default.
# Library users that only install locally can drop it:
#   easy-install = { version = "1", default-features = false, features = ["tar-gz"] }
ssh = ["dep:sssh"]
tar = ["easy-archive/tar"]
tar-gz = ["tar", "easy-archive/tar-gz"]
tar-xz = ["tar", "easy-archive/tar-xz"]
tar-bz = ["tar", "easy-archive/tar-bz"]
tar-zstd = ["tar", "easy-archive/tar-zstd"]
gz = ["easy-archive/gz"]
zip = ["easy-archive/zip"]
logging = ["crud-path/logging", "dep:tracing-subscriber"]
cli = ["dep:clap", "dep:clap_complete", "dep:const-str", "dep:git-version"]

[profile.release]
debug = false
lto = true
strip = true
opt-level = 3
panic = "abort"
codegen-units = 1

[profile.bloaty]
debug = true
lto = false
strip = false
inherits = 'release'

[[bin]]
name = "ei"
path = "src/main.rs"
required-features = ["cli"]
