name: Release

permissions:
  contents: write

on: [push]

defaults:
  run:
    shell: bash --noprofile --norc -CeEuo pipefail {0}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            RUSTFLAGS: -C target-feature=+crt-static
          - target: x86_64-pc-windows-gnu
            os: windows-latest
          # - target: arm64ec-pc-windows-msvc
          #   os: windows-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: run cross-build
        uses: ahaoboy/cross-build@v1
        with:
          bin: ei
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ matrix.target }}
          RUSTFLAGS: ${{ matrix.RUSTFLAGS }}
          tag: nightly
          allowUpdates: true
      - name: wait
        run: |
          sleep 300
      - name: install.sh
        run: |
          bash ./install.sh
  bloaty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: ei
        run: curl -fsSL https://raw.githubusercontent.com/easy-install/easy-install/main/install.sh | sh
      - name: install bloaty
        run: |
          ei https://github.com/ahaoboy/bloaty-build
          ei https://github.com/ahaoboy/bloaty-metafile
      - name: bloaty-metafile
        run: |
          cargo build --profile bloaty
          bloaty ./target/bloaty/ei -d sections,symbols -n 0 --csv > meta.csv
          bloaty-metafile meta.csv > meta.json
      - uses: actions/upload-artifact@v4
        with:
          name: bloaty-metafile
          path: |
            meta.json
            meta.csv
