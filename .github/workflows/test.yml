name: Test

permissions:
  contents: read

on: [push]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

defaults:
  run:
    shell: bash --noprofile --norc -CeEuo pipefail {0}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: feature matrix
        run: |
          cargo check --no-default-features
          cargo check --no-default-features --features ssh
          cargo check --no-default-features --features cli

  rust-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          cargo test
      - name: cargo install
        run: |
          cargo install --features=logging --path .
      - name: ei version
        run: |
          ei --version
      - name: install
        run: |
          for file in dist-manifest/*.json; do
            echo $file
            ei $file
          done

      - name: install list
        run: |
          cat assets/url-list.txt | while read line
          do
              echo $line
              [[ -z "$line" ]] && continue
              ei $line
          done

      - name: install alias qjs-next
        run: |
          ei https://github.com/quickjs-ng/quickjs --name qjs --alias qjs-next
      - name: install alias ladybird
        if: matrix.os != 'windows-latest'
        run: |
          ei https://github.com/LadybirdBrowser/ladybird/actions/workflows/js-and-wasm-artifacts.yml --name ladybird-js --alias ladybird

      - name: test which
        if: matrix.os != 'windows-latest'
        run: |
          ls -lh ~/.ei
          cat assets/${{ matrix.os }}.txt | while read line
          do
              echo $line
              [[ -z "$line" ]] && continue
              # ls -lh ~/.ei/$line
              which $line
          done
      - name: test which on windows
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Get-Content "assets/${{ matrix.os }}.txt" | ForEach-Object {
              Write-Output $_
              Get-Command $_
          }
